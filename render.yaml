services:
  - type: web
    name: bill-generator
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: DB_TYPE
        value: supabase
      - key: SUPABASE_URL
        value: https://ermlglgjwuxiurbfhzkf.supabase.co
      - key: SUPABASE_KEY
        sync: false
      - key: SECRET_KEY
        generateValue: true
